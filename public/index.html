<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latihan Kraepelin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 2rem auto; padding: 0 1rem; text-align: center; color: #222; background: #fff; }
  input, select, button { font-size: 1rem; padding: .6rem; margin: .3rem 0; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  #q { font-size: 4rem; margin: 1.5rem 0; }
  .row { display: flex; gap: .5rem; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  td, th { border-bottom: 1px solid #ccc; padding: .3rem; }
  .me { font-weight: bold; background: #ffc; }
  .err { color: #b00; }
</style>
</head>
<body>
<h1>Latihan Kraepelin</h1>

<div id="start" hidden>
  <p>Jumlahkan dua angka, lalu pilih hasilnya ganjil atau genap.</p>
  <input id="name" placeholder="Nama" maxlength="40" autocomplete="off">
  <select id="minutes"></select>
  <button id="go">Mulai</button>
  <p id="err" class="err"></p>
</div>

<div id="test" hidden>
  <div>Sisa waktu: <b id="time">--:--:--</b> | Dijawab: <b id="count">0</b></div>
  <div id="q">…</div>
  <div class="row">
    <button id="odd">Ganjil (J)</button>
    <button id="even">Genap (G)</button>
  </div>
</div>

<div id="result" hidden>
  <div id="summary"></div>
  <h3 id="boardTitle">Peringkat</h3>
  <div id="board"></div>
  <button id="again">Tes lagi</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'kraepelin_attempt';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const label = (m) => (m === 60 ? '1 jam' : m + ' menit');
const show = (id) => ['start', 'test', 'result'].forEach((s) => ($(s).hidden = s !== id));

$('minutes').innerHTML = [1, 5, 10, 15, 30, 45, 60].map((m) => `<option value="${m}">${label(m)}</option>`).join('');

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  return { status: r.status, data: await r.json() };
}

let id, qs, next, queue, sending, loading, done, deadline, count, timer;

async function begin(s) {
  id = s.id; qs = []; queue = []; sending = false; loading = false; done = false;
  count = s.answered; next = s.answered;
  // Sisa waktu selalu dari server, jadi refresh tidak mengulang durasi.
  deadline = performance.now() + s.remainingMs;
  show('test');
  await more();
  draw();
  clearInterval(timer);
  timer = setInterval(tick, 200);
  tick();
}

async function more() {
  const r = await api(`/api/attempts/${id}/questions?from=${next}&count=50`);
  qs.push(...r.data.questions);
  next += r.data.questions.length;
}

function draw() {
  const q = qs[0];
  $('q').textContent = q ? `${q.a} + ${q.b}` : '…';
  $('count').textContent = count;
}

function answer(v) {
  if (done || !qs.length) return;
  const q = qs.shift();
  queue.push({ i: q.i, answer: v });
  count++;
  if (qs.length < 20 && !loading) {
    loading = true;
    more().catch(() => {}).finally(() => (loading = false));
  }
  draw();
  drain();
}

// Jawaban dikirim berurutan di belakang layar supaya tampilan tetap cepat.
async function drain() {
  if (sending) return;
  sending = true;
  while (queue.length) {
    try {
      const r = await api(`/api/attempts/${id}/answers`, queue[0]);
      if (r.status === 410) queue.length = 0;
      else queue.shift();
    } catch {
      await sleep(1000);
    }
  }
  sending = false;
}

function tick() {
  const ms = Math.max(0, deadline - performance.now());
  const s = Math.ceil(ms / 1000);
  $('time').textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  if (ms === 0 && !done) finish();
}

async function finish() {
  done = true;
  clearInterval(timer);
  for (let k = 0; k < 50 && (sending || queue.length); k++) await sleep(200);
  result((await api(`/api/attempts/${id}`)).data);
}

async function result(s) {
  show('result');
  $('summary').innerHTML = `<h2>${esc(s.name)}</h2><p>Benar: <b>${s.correct}</b> | Salah: <b>${s.wrong}</b> | Dijawab: <b>${s.answered}</b></p>`;
  $('boardTitle').textContent = `Peringkat durasi ${label(s.minutes)}`;
  $('board').textContent = 'Memuat peringkat…';
  await sleep(2500); // tunggu server menutup percobaan ini
  const { data } = await api(`/api/leaderboard?minutes=${s.minutes}`);
  $('board').innerHTML = '<table><tr><th>#</th><th>Nama</th><th>Benar</th><th>Salah</th><th>Dijawab</th></tr>' +
    data.map((r) => `<tr class="${r.id === s.id ? 'me' : ''}"><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.answered}</td></tr>`).join('') + '</table>';
}

$('go').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) return ($('err').textContent = 'Isi nama dulu.');
  const r = await api('/api/attempts', { name, minutes: Number($('minutes').value) });
  if (r.status !== 201) return ($('err').textContent = r.data.error);
  localStorage.setItem(KEY, r.data.id);
  begin(r.data);
};
$('odd').onclick = () => answer('ganjil');
$('even').onclick = () => answer('genap');
$('again').onclick = () => { localStorage.removeItem(KEY); $('err').textContent = ''; show('start'); };
document.onkeydown = (e) => {
  if ($('test').hidden) return;
  const k = e.key.toLowerCase();
  if (k === 'j') answer('ganjil');
  if (k === 'g') answer('genap');
};
onbeforeunload = (e) => { if (!$('test').hidden && !done) e.preventDefault(); };

(async () => {
  const saved = localStorage.getItem(KEY);
  if (!saved) return show('start');
  const r = await api('/api/attempts/' + saved);
  if (r.status !== 200) { localStorage.removeItem(KEY); return show('start'); }
  r.data.finished ? result(r.data) : begin(r.data);
})();
</script>
</body>
</html>
